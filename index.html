<!DOCTYPE html>
<html lang="en">
<head>
    <title>iPhone Product</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        /* Header */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
        }

        /* Layout */
        .main {
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 20%;
            background-color: #34495e;
            color: white;
            padding: 20px;
            height: 100vh;
        }

        .sidebar h3 {
            margin-bottom: 10px;
        }

        .sidebar p {
            padding: 8px 0;
            cursor: pointer;
        }

        .sidebar p:hover {
            color: white;
        }

        /* Content */
        .content {
            width: 80%;
            padding: 20px;
        }

        /* Card */
        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        img {
            width: 300px;
            border-radius: 10px;
        }

        h2 {
            color: #2c3e50;
        }

        p {
            color: #555;
        }

        .price {
            color: #27ae60;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        My Store
    </header>

    <!-- Main Layout -->
    <div class="main">

        <!-- Sidebar -->
        <div class="sidebar">
            <h3>Menu</h3>
            <p>Home</p>
            <p>About</p>
            <p>Contact</p>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="card">

                <h2>Product Name: iPhone 14</h2>

                <img src="https://m.media-amazon.com/images/I/61cwywLZR-L._SL1500_.jpg" 
                     alt="iPhone Image">
 <p>Description: The iPhone 14 comes with a powerful A15 Bionic chip, advanced camera system, and long-lasting battery.</p>
                
                <div class="price">Price: ₹79,999</div>

            </div>
        </div>

    </div>

</body>
</html>
