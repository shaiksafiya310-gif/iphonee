<!DOCTYPE html>
<html lang="en">
<head>
    <title>iPhone Product</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }
        /* Content */
        .content {
            width: 80%;
            padding: 20px;
        }

        /* Card */
        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        img {
            width: 300px;
            border-radius: 10px;
        }

        h2 {
            color: #2c3e50;
        }

        p {
            color: #555;
        }

        .price {
            color: #27ae60;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>
        <!-- Content -->
        <div class="content">
            <div class="card">

                <h2>Product Name: iPhone 14</h2>

                <img src="https://m.media-amazon.com/images/I/61cwywLZR-L._SL1500_.jpg" 
                     alt="iPhone Image">
                 <p>Description: The iPhone 14 comes with a powerful A15 Bionic chip, advanced camera system, and long-lasting battery.</p>
                
                <div class="price">Price: ₹79,999</div>

            </div>
        </div>

    </div>

</body>
</html>
